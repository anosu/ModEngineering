name: Shared Mod validation and Android release
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      dependency_repository:
        default: ''
        type: string
      dependency_path:
        default: ''
        type: string
    secrets:
      DEPENDENCY_DEPLOY_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize pinned public engineering and runtime
        shell: bash
        run: |
          git submodule update --init --recursive shared/ModEngineering
          if [ -d shared/Utility ]; then
            git submodule update --init --recursive shared/Utility
          fi
      - name: Read pinned optional dependency revision
        if: inputs.dependency_repository != ''
        id: extension
        shell: bash
        env:
          DEPENDENCY_PATH: ${{ inputs.dependency_path }}
        run: echo "revision=$(git rev-parse \"HEAD:$DEPENDENCY_PATH\")" >> "$GITHUB_OUTPUT"
      - name: Check out optional dependency
        if: inputs.dependency_repository != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.dependency_repository }}
          ref: ${{ steps.extension.outputs.revision }}
          path: ${{ inputs.dependency_path }}
          ssh-key: ${{ secrets.DEPENDENCY_DEPLOY_KEY }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate conventions and formatting
        run: python shared/ModEngineering/scripts/mod.py check
      - name: Run independent tests
        run: python shared/ModEngineering/scripts/mod.py test
      - name: Build shared library
        if: inputs.kind == 'library'
        run: python shared/ModEngineering/scripts/mod.py build
      - name: Build and verify Android package
        if: inputs.kind == 'android'
        shell: pwsh
        run: |
          $arguments = @{}
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.ExpectedVersion = $env:GITHUB_REF_NAME }
          & ./scripts/build-release.ps1 @arguments
      - name: Publish tagged Android release
        if: inputs.kind == 'android' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content mod.json -Raw | ConvertFrom-Json
          $directory = Join-Path 'artifacts/release' $env:GITHUB_REF_NAME
          $files = @((Join-Path $directory $config.package.name), (Join-Path $directory 'SHA256SUMS.txt'))
          foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file)) { throw "Missing release file: $file" } }
          & gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            & gh release create $env:GITHUB_REF_NAME @files --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
